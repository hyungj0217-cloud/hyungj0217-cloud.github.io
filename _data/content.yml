### Skills [ skills ]
skills:
  title: "Professional Skills"
  subtitle: "my <b>Talent</b>"
  bg_title: "Skills"

  column1:
    items:
      - label: "C Language"
        text: "C, C++의 기초적인 문법을 이해하고 시스템 프로그래밍에 활용할 수 있습니다."
        value: "70"

      - label: "Python"
        text: "보안 툴 자동화 스크립트 제작 및 데이터 분석에 Python을 다룰 수 있습니다."
        value: "75"

  column2:
    items:
      - label: "JavaScript"
        text: "웹 프론트엔드 환경을 이해하고 크로스 사이트 스크립팅(XSS) 등 웹 취약점 분석에 활용합니다."
        value: "75"

      - label: "Linux (CentOS/Ubuntu)"
        text: "리눅스 서버 환경의 권한 관리, 서비스 설정 및 시스템 로그 분석이 가능합니다."
        value: "80"

### Resume [ resume ]
resume:
  title: "Resume"
  subtitle: "my <b>Story</b>"
  bg_title: "History"

  education:
    title: "Education"
    items:
      - name: "한국폴리텍대학 강서캠퍼스"
        subname: "사이버보안과 (2학년 재학)"
        period: "2025 - Present"
        text: "네트워크 보안, 시스템 보안, 모의해킹, 암호학 등 정보보안 전반의 실무 기술을 학습하고 있습니다."

  experience:
    title: "Certifications &amp; Activity"
    items:
      - name: "정보보안산업기사"
        subname: "한국인터넷진흥원(KISA)"
        period: "2026"
        text: "시스템, 네트워크, 어플리케이션 보안 및 정보보안 관계 법령에 대한 지식을 검증받았습니다."

      - name: "리눅스마스터 2급"
        subname: "한국정보통신진흥협회(KAIT)"
        period: "2025"
        text: "리눅스 시스템 운영 및 기본 명령어 활용, 네트워크 서비스 설정 능력을 인증받았습니다."

      - name: "네트워크관리사 2급"
        subname: "한국정보통신자격협회(ICQA)"
        period: "2025"
        text: "네트워크 일반, TCP/IP, NOS 및 네트워크 운용기기 설정 능력을 갖추었습니다."



